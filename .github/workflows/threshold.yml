name: Performance Threshold Load Tests

on:
  push:
    branches: [ main, master ]
  pull_request:
    branches: [ main, master ]
  workflow_dispatch:

jobs:
  threshold-tests:
    name: Load Latency & Threshold Suite
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: 'npm'

      - name: Install Node Dependencies
        run: npm install

      - name: Build Web Application
        run: npm run build

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install Python Requests
        run: pip install requests

      - name: Start Production Preview Server
        run: |
          npx vite preview --host 127.0.0.1 --port 5174 &
          npx --yes wait-on http://127.0.0.1:5174 --timeout 30000

      - name: Execute Performance Threshold Load Test
        run: |
          python scripts/load_test.py --users 50 --duration 15 --output test-results/load-test-summary.json

      - name: Upload Load Test Report Artifact
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: load-test-summary
          path: test-results/load-test-summary.json
