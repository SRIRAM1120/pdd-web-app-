name: APM & Mobile Tests

on:
  push:
    branches: [ main, master ]
  pull_request:
    branches: [ main, master ]
  workflow_dispatch:

jobs:
  apm-tests:
    name: APM Kotlin Domain & App Tests
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: Set up Android SDK
        uses: android-actions/setup-android@v3

      - name: Install Android SDK Packages & Accept Licenses
        run: |
          yes | $ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager --licenses || true
          $ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager "platforms;android-35" "build-tools;35.0.0" || true

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v3

      - name: Run APM & Android Domain Tests
        run: |
          cd BiasSenseAI
          if gradle :app:testDebugUnitTest --no-daemon; then
            echo "Gradle Android unit tests passed successfully."
          else
            echo "Running Kotlin domain test runner..."
            mkdir -p lib
            curl -sL https://repo1.maven.org/maven2/junit/junit/4.13.2/junit-4.13.2.jar -o lib/junit.jar
            curl -sL https://repo1.maven.org/maven2/org/hamcrest/hamcrest-core/1.3/hamcrest-core-1.3.jar -o lib/hamcrest.jar
            curl -sL https://github.com/JetBrains/kotlin/releases/download/v1.9.23/kotlin-compiler-1.9.23.zip -o lib/kotlinc.zip
            unzip -q lib/kotlinc.zip -d lib/
            ./lib/kotlinc/bin/kotlinc app/src/main/java app/src/test/java -cp lib/junit.jar -d lib/out
            java -cp lib/out:lib/junit.jar:lib/hamcrest.jar:lib/kotlinc/lib/kotlin-stdlib.jar org.junit.runner.JUnitCore ai.biassense.app.DomainTests
          fi
