name: APM & Mobile Tests

on:
  push:
    branches: [ main, master ]
  pull_request:
    branches: [ main, master ]
  workflow_dispatch:

jobs:
  apm-tests:
    name: APM Mobile Domain & App Tests
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: 'npm'

      - name: Install Node Dependencies
        run: npm install

      - name: Run Mobile Domain APM Logic Tests
        run: npx vitest run src/lib/validation.test.ts src/lib/labAnalysis.test.ts

      - name: Run Kotlin APM Domain Unit Suite
        run: |
          mkdir -p /tmp/kotlin-runner
          cd /tmp/kotlin-runner
          curl -sL https://repo1.maven.org/maven2/junit/junit/4.13.2/junit-4.13.2.jar -o junit.jar
          curl -sL https://repo1.maven.org/maven2/org/hamcrest/hamcrest-core/1.3/hamcrest-core-1.3.jar -o hamcrest.jar
          curl -sL https://github.com/JetBrains/kotlin/releases/download/v1.9.20/kotlin-compiler-1.9.20.zip -o kotlinc.zip
          unzip -q kotlinc.zip
          
          cd $GITHUB_WORKSPACE/BiasSenseAI
          /tmp/kotlin-runner/kotlinc/bin/kotlinc \
            app/src/main/java/ai/biassense/app/domain/*.kt \
            app/src/test/java/ai/biassense/app/DomainTests.kt \
            -cp /tmp/kotlin-runner/junit.jar \
            -d /tmp/kotlin-runner/out
          
          java -cp /tmp/kotlin-runner/out:/tmp/kotlin-runner/junit.jar:/tmp/kotlin-runner/hamcrest.jar:/tmp/kotlin-runner/kotlinc/lib/kotlin-stdlib.jar \
            org.junit.runner.JUnitCore ai.biassense.app.DomainTests
