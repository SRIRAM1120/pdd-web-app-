name: APM & Mobile Tests

on:
  push:
    branches: [ main, master ]
  pull_request:
    branches: [ main, master ]
  workflow_dispatch:

jobs:
  apm-tests:
    name: APM Kotlin Domain & App Tests
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: Run Android Domain Unit Tests
        run: |
          cd BiasSenseAI
          if [ -f "./gradlew" ]; then
            chmod +x gradlew
            ./gradlew test --no-daemon
          else
            gradle test --no-daemon
          fi
